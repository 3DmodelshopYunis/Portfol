<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunis | 3D Artist Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050505;
            --accent-purple: #8e2de2;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --neon-glow: 0 0 15px rgba(142, 45, 226, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-purple); }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #11111a 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, .brand-name, .nav-links a, .gate-btn {
            font-family: 'Rajdhani', sans-serif;
        }

        /* Naviqasiya */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 8%; background: rgba(5,5,5,0.85); 
            backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid var(--border-glass); 
        }

        .brand-container { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 45px; width: auto; border-radius: 4px; }
        .brand-name { font-weight: 700; letter-spacing: 2px; font-size: 1.3rem; color: #fff; }

        .nav-links { display: flex; list-style: none; gap: 35px; }
        .nav-links li a {
            color: var(--text-muted); text-decoration: none; font-weight: 600; 
            font-size: 1.1rem; letter-spacing: 1px; transition: 0.3s;
        }
        .nav-links li a:hover { color: #fff; text-shadow: var(--neon-glow); }

        /* Hero Bölməsi */
        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 5.5rem; letter-spacing: 12px; margin-bottom: 10px; font-weight: 700; background: linear-gradient(to right, #fff, var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-muted); letter-spacing: 5px; font-weight: 400; text-transform: uppercase; font-size: 1.1rem; }

        .section { padding: 80px 10%; }

        /* Portfel Kartları */
        .model-card { 
            background: rgba(20, 20, 20, 0.4); border: 1px solid var(--border-glass); 
            margin-bottom: 100px; border-radius: 8px; overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .model-card:hover { border-color: rgba(142, 45, 226, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        .model-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); }
        .model-header h3 { font-size: 1.8rem; letter-spacing: 1px; }
        .model-header p { font-family: 'Inter'; color: var(--accent-purple); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px;}

        .gallery-wrapper { display: flex; overflow-x: auto; height: 75vh; scroll-snap-type: x mandatory; background: #000; }
        .gallery-wrapper img { height: 100%; width: auto; object-fit: cover; scroll-snap-align: start; }

        /* Admin Düymələri */
        .btn {
            background: transparent; border: 1px solid var(--accent-purple); color: white;
            padding: 10px 25px; cursor: pointer; font-family: 'Rajdhani';
            font-weight: 700; letter-spacing: 1px; transition: 0.3s; border-radius: 4px;
        }
        .btn:hover { background: var(--accent-purple); box-shadow: var(--neon-glow); }
        
        .admin-panel { display: none; background: #111; padding: 15px; border-top: 1px solid #333; gap: 10px; align-items: center; flex-wrap: wrap; }
        .admin-input { background: #0a0a0a; border: 1px solid #333; color: white; padding: 10px; flex-grow: 1; border-radius: 4px; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif;}
        .admin-input:focus { border-color: var(--accent-purple); }

        #add-project-btn {
            display: none; position: fixed; bottom: 30px; right: 30px; 
            background: var(--accent-purple); width: 60px; height: 60px; 
            border-radius: 50%; border: none; color: white; cursor: pointer;
            box-shadow: var(--neon-glow); z-index: 2000; font-size: 28px; transition: 0.3s;
        }
        #add-project-btn:hover { transform: scale(1.1); }

        /* Modal Pəncərələr */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #111; padding: 40px; border: 1px solid #333; border-radius: 8px; width: 400px; text-align: center; }
        .modal-box input, .modal-box textarea { width: 100%; margin-bottom: 15px; }
        .modal-box textarea { resize: vertical; min-height: 80px; }

    </style>
</head>
<body>

    <!-- Yüklənmə Ekranı -->
    <div id="loading-screen" style="position:fixed; inset:0; background:var(--bg-dark); z-index:10000; display:flex; justify-content:center; align-items:center; transition:0.5s;">
        <div style="width:50px; height:50px; border:2px solid transparent; border-top-color:var(--accent-purple); border-radius:50%; animation:spin 1s linear infinite;"></div>
    </div>

    <!-- Admin Login Modalı -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-box">
            <h2 style="margin-bottom:20px; font-family:'Rajdhani'; letter-spacing: 2px;">Admin Login</h2>
            <input type="email" id="admin-email" class="admin-input" placeholder="Email">
            <input type="password" id="admin-pass" class="admin-input" placeholder="Password">
            <button class="btn" onclick="loginAdmin()" style="width:100%; margin-top: 10px;">LOGIN</button>
            <button class="btn" onclick="document.getElementById('login-modal').style.display='none'" style="width:100%; margin-top: 10px; border-color: #555; background: transparent;">CANCEL</button>
        </div>
    </div>

    <!-- Yeni Proyekt Əlavə Etmə Modalı (BƏRPA EDİLDİ) -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-box" style="width: 500px;">
            <h2 style="margin-bottom:20px; font-family:'Rajdhani'; letter-spacing: 2px;">Add New Project</h2>
            <input type="text" id="proj-title" class="admin-input" placeholder="Project Title (e.g., Cyberpunk Car)">
            <input type="text" id="proj-cat" class="admin-input" placeholder="Category (e.g., Hard-Surface)">
            <textarea id="proj-imgs" class="admin-input" placeholder="Image URLs (virgül ilə ayırın. Məs: link1, link2)"></textarea>
            
            <button class="btn" onclick="saveProject()" style="width:100%; margin-top: 10px;">SAVE TO DATABASE</button>
            <button class="btn" onclick="closeProjectModal()" style="width:100%; margin-top: 10px; border-color: #555; background: transparent;">CANCEL</button>
        </div>
    </div>

    <div id="site-content">
        <nav>
            <div class="brand-container">
                <!-- Şəkil yoxdursa "alt" yazısı görünəcək -->
                <img src="logo_n.jpg" alt="Yunis Logo" class="logo-img">
                <span class="brand-name">YUNIS | 3D ARTIST</span>
            </div>
            <ul class="nav-links">
                <li><a href="#work">WORKS</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>

        <section class="hero">
            <h1>SURFACE ARTIST</h1>
            <p>CGI • Hard-Surface • Environments</p>
        </section>

        <section class="section" id="work">
            <div id="dynamic-projects-container">
                <!-- Proyektlər bura yüklənəcək -->
            </div>
        </section>
    </div>

    <!-- Plus düyməsi -->
    <button id="add-project-btn" onclick="openProjectModal()">+</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        // ƏSKİK OLAN addDoc, deleteDoc və doc BƏRPA EDİLDİ
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBafeOXXvPHM-oMjstmkk2vgsxOYN-5Jks",
            authDomain: "portfolio-yunis.firebaseapp.com",
            projectId: "portfolio-yunis",
            storageBucket: "portfolio-yunis.firebasestorage.app",
            messagingSenderId: "1650727261",
            appId: "1:1650727261:web:b472a1040274eb9d29b0b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.isAdmin = false;

        // Sayt yüklənəndə Auth vəziyyətini yoxlayır
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.isAdmin = true;
                document.getElementById('add-project-btn').style.display = 'block';
                console.log("Admin kimi daxil olundu.");
            } else {
                window.isAdmin = false;
                document.getElementById('add-project-btn').style.display = 'none';
            }
            loadProjects(); 
            
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            }, 800);
        });

        // CTRL + Q ilə admin login açmaq
        document.addEventListener('keydown', (e) => {
            if(e.ctrlKey && e.key === 'q') {
                document.getElementById('login-modal').style.display = 'flex';
            }
        });

        // Qlobal window obyektinə funksiyaları təyin edirik ki, HTML-dəki onclick işləsin
        window.loginAdmin = () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            
            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    document.getElementById('login-modal').style.display = 'none';
                    alert("Admin olaraq daxil oldunuz!");
                })
                .catch((error) => {
                    alert("Xəta: Email və ya Şifrə yalnışdır!");
                });
        };

        // Pəncərəni açmaq
        window.openProjectModal = () => {
            document.getElementById('add-modal').style.display = 'flex';
        };

        // Pəncərəni bağlamaq
        window.closeProjectModal = () => {
            document.getElementById('add-modal').style.display = 'none';
            document.getElementById('proj-title').value = '';
            document.getElementById('proj-cat').value = '';
            document.getElementById('proj-imgs').value = '';
        };

        // BAZAYA MƏLUMAT YAZMAQ (BƏRPA EDİLDİ)
        window.saveProject = async () => {
            const title = document.getElementById('proj-title').value;
            const cat = document.getElementById('proj-cat').value;
            const imgsRaw = document.getElementById('proj-imgs').value;
            
            if(!title || !imgsRaw) {
                alert("Başlıq və Şəkil URL-ləri mütləqdir!");
                return;
            }
            
            // Vergüllə ayrılmış linkləri Array-ə (siyahıya) çeviririk
            const imgsArray = imgsRaw.split(',').map(s => s.trim()).filter(s => s !== "");
            
            try {
                await addDoc(collection(db, "projects"), {
                    title: title,
                    cat: cat,
                    imgs: imgsArray,
                    orderId: Date.now() // Sıralama üçün indiki vaxt
                });
                alert("Proyekt uğurla əlavə edildi!");
                window.closeProjectModal();
            } catch (error) {
                console.error("Xəta baş verdi: ", error);
                alert("Əlavə etmək mümkün olmadı. Konsola baxın.");
            }
        };

        // BAZADAN MƏLUMAT SİLMƏK (BƏRPA EDİLDİ)
        window.deleteProject = async (docId) => {
            if(confirm("Bu proyekti silmək istədiyinizə əminsiniz?")) {
                try {
                    await deleteDoc(doc(db, "projects", docId));
                } catch (error) {
                    console.error("Silinmə xətası:", error);
                    alert("Silinmə zamanı xəta oldu.");
                }
            }
        };

        // Proyektləri Firebase-dən oxumaq
        function loadProjects() {
            const q = query(collection(db, "projects"), orderBy("orderId", "desc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('dynamic-projects-container');
                container.innerHTML = "";

                snapshot.forEach((docItem) => {
                    const p = docItem.data();
                    const docId = docItem.id; // Silmək üçün Firebase Document ID-si lazımdır
                    
                    let adminControls = "";
                    if (window.isAdmin) {
                        adminControls = `
                        <div class="admin-panel" style="display:flex;">
                            <!-- Sil düyməsi artıq birbaşa docId-ni alır -->
                            <span onclick="deleteProject('${docId}')" style="color:red; cursor:pointer; font-weight:bold; margin-left:auto; letter-spacing: 1px;">DELETE PROJECT</span>
                        </div>`;
                    }

                    let imgHTML = p.imgs.map(src => `<img src="${src}" alt="${p.title}">`).join('');

                    container.innerHTML += `
                    <article class="model-card">
                        <div class="model-header">
                            <div><h3>${p.title}</h3><p>${p.cat}</p></div>
                        </div>
                        <div class="gallery-wrapper">${imgHTML}</div>
                        ${adminControls}
                    </article>`;
                });
            });
        }

        // Qalereyada Mouse tekeri ilə sağa-sola sürüşdürmək
        document.addEventListener('wheel', (e) => {
            const container = e.target.closest('.gallery-wrapper');
            if (container) {
                e.preventDefault(); 
                container.scrollBy({ left: e.deltaY * 1.5, behavior: 'smooth' });
            }
        }, { passive: false });

    </script>
</body>
</html>
